name: Update GitHub stats

# Regenerates assets/github-streak.svg from GitHub's own contribution data so
# the profile README never depends on a third-party stats service or its cache.
on:
  schedule:
    - cron: "47 */6 * * *" # every 6 hours, off the hour to dodge peak load
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"
      - "tools/generate_streak.py"
      - "tools/build_readme.py"
      - "README.md"

# Never run two refreshes at once (they would race on the same file).
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only needed to commit the generated SVG
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate streak card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python tools/generate_streak.py

      # Commit only when the rendered card actually changed.
      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add assets/github-streak.svg
          if git diff --cached --quiet; then
            echo "Streak card unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub streak stats"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
